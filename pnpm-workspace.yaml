# Electron tooling (@electron/packager --prune) expects a flat npm-style
# node_modules layout and cannot follow pnpm's symlinked virtual store.
nodeLinker: hoisted

# exceljs 4.4.0 pins uuid@^8, which has a known advisory (GHSA fixed in 11.1.1).
# uuid 11 still ships CommonJS and the v4() exceljs uses.
overrides:
  uuid: ^11.1.1
