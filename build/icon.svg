<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#bg)"/>

  <!-- Stack of three envelopes: two behind, one in front -->
  <g filter="url(#shadow)">
    <!-- back envelope -->
    <g transform="translate(512 470) rotate(-10) translate(-512 -470)" opacity="0.55">
      <rect x="262" y="330" width="500" height="320" rx="34" fill="url(#paper)"/>
      <path d="M262 364 L512 540 L762 364" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- middle envelope -->
    <g transform="translate(512 490) rotate(6) translate(-512 -490)" opacity="0.8">
      <rect x="262" y="350" width="500" height="320" rx="34" fill="url(#paper)"/>
      <path d="M262 384 L512 560 L762 384" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- front envelope -->
    <g>
      <rect x="242" y="400" width="540" height="340" rx="36" fill="url(#paper)"/>
      <!-- flap -->
      <path d="M242 436 L512 630 L782 436" fill="none" stroke="#2563eb" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- bottom folds -->
      <path d="M242 740 L450 585 M782 740 L574 585" fill="none" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Paper-clip / attachment badge -->
  <g transform="translate(690 300)">
    <circle r="118" fill="#0f766e" stroke="#ffffff" stroke-width="18"/>
    <!-- clip -->
    <path d="M-38 -10 L 10 -58 a 34 34 0 0 1 48 48 L -18 66 a 22 22 0 0 1 -31 -31 L 30 -44"
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
